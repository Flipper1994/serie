<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Serien-Katalog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='18' rx='3' fill='%23c2410c'/%3E%3Cpath d='M13 11v8l7-4z' fill='%23fff'/%3E%3Crect x='10' y='26' width='12' height='2' rx='1' fill='%23c2410c'/%3E%3C/svg%3E">
<style>
  /* ---------- Design-Tokens ---------- */
  :root {
    --bg: #f6f4f1;
    --flaeche: #ffffff;
    --flaeche-2: #f0ede8;
    --flaeche-3: #ebe6df;
    --text: #1c1a17;
    --text-2: #5f5a52;
    --text-3: #8a8478;
    --linie: #e3ded6;
    --linie-2: #d4cdc2;
    --akzent: #c2410c;
    --akzent-2: #ea580c;
    --akzent-text: #ffffff;
    --akzent-weich: #fdeee5;
    --fehler: #b42318;
    --fehler-weich: #fdecea;
    --ok-weich: #e8f3ec;
    --ok: #1f6f43;
    --warn: #b45309;
    --warn-weich: #fdf3e3;
    --schatten-1: 0 1px 2px rgba(28, 26, 23, .05);
    --schatten-2: 0 4px 16px rgba(28, 26, 23, .06), 0 1px 3px rgba(28, 26, 23, .04);
    --schatten-3: 0 12px 32px rgba(28, 26, 23, .08), 0 4px 12px rgba(28, 26, 23, .05);
    --radius: 16px;
    --radius-klein: 10px;
    --radius-rund: 999px;
    --übergang: 160ms cubic-bezier(.4, 0, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0e0c;
      --flaeche: #1c1b18;
      --flaeche-2: #26241f;
      --flaeche-3: #312e28;
      --text: #f2efe9;
      --text-2: #a9a299;
      --text-3: #78726a;
      --linie: #34312b;
      --linie-2: #423e36;
      --akzent: #f97316;
      --akzent-2: #fb923c;
      --akzent-text: #1a0d03;
      --akzent-weich: #3a2112;
      --fehler: #f97066;
      --fehler-weich: #3b1a17;
      --ok-weich: #16291e;
      --ok: #6fcf97;
      --warn: #fbbf24;
      --warn-weich: #2d2410;
      --schatten-1: 0 1px 2px rgba(0, 0, 0, .3);
      --schatten-2: 0 4px 16px rgba(0, 0, 0, .35);
      --schatten-3: 0 12px 32px rgba(0, 0, 0, .5);
    }
  }

  /* ---------- Basis ---------- */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: var(--akzent); color: var(--akzent-text); }

  .rahmen { max-width: 820px; margin: 0 auto; padding: 24px 16px 56px; }

  /* ---------- Kopfzeile ---------- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: -.015em;
    font-weight: 700;
  }
  h1 span {
    background: linear-gradient(135deg, var(--akzent), var(--akzent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .leise { color: var(--text-2); font-size: .875rem; }
  .leise-klein { color: var(--text-3); font-size: .8rem; }

  /* ---------- Schaltflächen ---------- */
  button, input, select { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  .knopf {
    border: 0;
    border-radius: var(--radius-klein);
    background: linear-gradient(135deg, var(--akzent), var(--akzent-2));
    color: var(--akzent-text);
    font-weight: 650;
    padding: 12px 20px;
    cursor: pointer;
    min-height: 46px;
    width: 100%;
    transition: transform var(--übergang), box-shadow var(--übergang), opacity var(--übergang);
    box-shadow: 0 1px 2px rgba(194, 65, 12, .25);
  }
  .knopf:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(194, 65, 12, .3); }
  .knopf:active:not(:disabled) { transform: translateY(0); }
  .knopf:disabled { opacity: .55; cursor: progress; }
  .knopf-text {
    background: none; border: 0; padding: 4px 0;
    color: var(--text-2); cursor: pointer;
    font-size: .875rem; text-decoration: underline; text-underline-offset: 3px;
    transition: color var(--übergang);
  }
  .knopf-text:hover { color: var(--text); }

  /* ---------- Karten ---------- */
  .karte {
    background: var(--flaeche);
    border: 1px solid var(--linie);
    border-radius: var(--radius);
    box-shadow: var(--schatten-2);
    padding: 20px;
    transition: box-shadow var(--übergang);
  }
  .karte + .karte, #ausgabe > .karte { margin-top: 16px; }

  /* ---------- Suchformular ---------- */
  form.suche { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
  form.suche .knopf { width: auto; padding-inline: 28px; }
  label { display: block; font-size: .8rem; font-weight: 600; color: var(--text-2); margin-bottom: 6px; letter-spacing: .01em; }
  input[type=text], input[type=number], input[type=password] {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-klein);
    border: 1px solid var(--linie);
    background: var(--flaeche-2);
    outline: none;
    min-height: 46px;
    transition: border-color var(--übergang), box-shadow var(--übergang), background var(--übergang);
  }
  input::placeholder { color: var(--text-3); }
  input:focus {
    border-color: var(--akzent);
    box-shadow: 0 0 0 4px var(--akzent-weich);
    background: var(--flaeche);
  }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  @media (max-width: 540px) {
    form.suche { grid-template-columns: 1fr; }
    form.suche .knopf { width: 100%; }
  }

  /* ---------- Chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--linie);
    background: var(--flaeche-2);
    border-radius: var(--radius-rund);
    padding: 6px 13px;
    font-size: .85rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all var(--übergang);
  }
  .chip:hover { border-color: var(--akzent); transform: translateY(-1px); }
  .chip.aktiv {
    background: linear-gradient(135deg, var(--akzent), var(--akzent-2));
    border-color: transparent;
    color: var(--akzent-text);
    font-weight: 600;
    cursor: default;
    box-shadow: 0 2px 8px rgba(194, 65, 12, .3);
  }
  .chip.aktiv:hover { transform: none; }
  .chip.still { cursor: default; }
  .chip.still:hover { border-color: var(--linie); transform: none; }
  .chip:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  /* Stand je Staffel: Haken = komplett gesehen, Punkt = angefangen */
  .chip.fertig::before { content: "✓ "; font-weight: 700; }
  .chip.begonnen::before { content: "• "; }
  .chip.fertig:not(.aktiv), .chip.begonnen:not(.aktiv) { border-color: var(--ok); }
  .chip.fertig:not(.aktiv)::before, .chip.begonnen:not(.aktiv)::before { color: var(--ok); }
  .staffel-leiste { margin-top: 0; margin-bottom: 18px; }

  /* ---------- Ladeanzeige ---------- */
  .lade { display: flex; align-items: center; gap: 16px; }
  .kreisel {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 3px solid var(--linie);
    border-top-color: var(--akzent);
    animation: dreh 0.85s linear infinite;
    flex: none;
  }
  @keyframes dreh { to { transform: rotate(360deg); } }
  .lade-text { font-weight: 500; }
  .lade-text .leise { display: block; margin-top: 2px; }

  /* ---------- Ergebnisanzeige ---------- */
  .titel {
    font-size: 1.65rem;
    line-height: 1.2;
    margin: 0 0 6px;
    letter-spacing: -.02em;
    font-weight: 700;
  }
  .meta { color: var(--text-2); margin: 0 0 16px; font-size: .925rem; }
  .meta .trenner { color: var(--text-3); margin: 0 6px; }
  .abschnitt { margin-top: 18px; }
  .abschnitt > .leise { display: block; margin-bottom: 8px; font-weight: 600; font-size: .8rem; letter-spacing: .02em; text-transform: uppercase; }

  /* Treffer-Hinweis (Folge gefunden / nicht gefunden) */
  .treffer {
    border-radius: var(--radius-klein);
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: .95rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .treffer.ja { background: var(--ok-weich); color: var(--ok); }
  .treffer.nein { background: var(--fehler-weich); color: var(--fehler); }
  .treffer-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
    flex: none;
  }

  /* ---------- Folgenliste ---------- */
  .folgen { display: flex; flex-direction: column; gap: 8px; }
  .folge {
    border: 1px solid var(--linie);
    border-radius: var(--radius-klein);
    background: var(--flaeche-2);
    overflow: hidden;
    transition: border-color var(--übergang), box-shadow var(--übergang);
  }
  .folge:hover { border-color: var(--linie-2); }
  .folge.markiert {
    border-color: var(--akzent);
    box-shadow: 0 0 0 3px var(--akzent-weich);
    background: var(--flaeche);
  }
  .folge-zeile { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .folge-kopf {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 8px 10px 4px;
    cursor: pointer;
    user-select: none;
  }
  .folge-kopf:hover .folge-titel-text { color: var(--akzent); }
  .folge-nr {
    flex: none;
    min-width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--flaeche-3);
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: .875rem;
    transition: background var(--übergang), color var(--übergang);
  }
  .folge.markiert .folge-nr { background: linear-gradient(135deg, var(--akzent), var(--akzent-2)); color: var(--akzent-text); }
  .folge-titel { flex: 1; min-width: 0; }
  .folge-titel-text {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color var(--übergang);
  }
  @media (max-width: 600px) {
    .folge-titel-text { white-space: normal; }
  }

  /* ---------- Abhaken ---------- */
  .haken-feld {
    flex: none;
    display: flex;
    align-items: center;
    padding: 0 8px 0 14px;
    margin: 0;
    cursor: pointer;
  }
  .haken {
    -webkit-appearance: none;
    appearance: none;
    width: 28px; height: 28px;
    margin: 0;
    border-radius: 8px;
    border: 2px solid var(--linie-2);
    background: var(--flaeche);
    cursor: pointer;
    display: grid;
    place-content: center;
    transition: background var(--übergang), border-color var(--übergang);
  }
  .haken::after {
    content: "";
    width: 13px; height: 7px;
    border-left: 3px solid var(--flaeche);
    border-bottom: 3px solid var(--flaeche);
    transform: translateY(-2px) rotate(-45deg) scale(0);
    transition: transform var(--übergang);
  }
  .haken:hover { border-color: var(--ok); }
  .haken:checked { background: var(--ok); border-color: var(--ok); }
  .haken:checked::after { transform: translateY(-2px) rotate(-45deg) scale(1); }
  .haken:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
  .haken:disabled { opacity: .45; cursor: not-allowed; }
  .folge.gesehen .folge-titel-text { color: var(--text-2); }
  .folge.gesehen .folge-nr { background: var(--ok-weich); color: var(--ok); }

  .fortschritt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .fortschritt-text { flex: 1; min-width: 160px; font-size: .925rem; color: var(--text-2); }
  .fortschritt-text strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .balken { height: 6px; border-radius: 3px; background: var(--flaeche-3); margin-top: 6px; overflow: hidden; }
  .balken-fuellung { height: 100%; background: var(--ok); border-radius: 3px; transition: width var(--übergang); }

  /* ---------- Meine Serien ---------- */
  .titel.klein { font-size: 1.2rem; margin-bottom: 14px; }
  .serien-liste { display: flex; flex-direction: column; gap: 8px; }
  .serien-zeile {
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
    padding: 12px 14px;
    border: 1px solid var(--linie);
    border-radius: var(--radius-klein);
    background: var(--flaeche-2);
    cursor: pointer;
    transition: border-color var(--übergang), background var(--übergang);
  }
  .serien-zeile:hover { border-color: var(--akzent); background: var(--akzent-weich); }
  .serien-name { font-weight: 600; overflow-wrap: anywhere; }
  .serien-stand { font-size: .85rem; color: var(--text-2); }
  .serien-stand .trenner { color: var(--text-3); margin: 0 6px; }
  .register-fuss { margin: 18px 0 0; }

  /* ---------- Stream-Buttons (inline in Folge-Zeile) ---------- */
  .stream-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    flex: none;
    justify-content: flex-end;
  }
  .stream-button {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: var(--radius-rund);
    border: 1px solid var(--linie);
    background: var(--flaeche);
    color: var(--text);
    cursor: pointer;
    font-size: .8rem;
    font-weight: 600;
    transition: all var(--übergang);
    white-space: nowrap;
    line-height: 1.3;
  }
  .stream-button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--akzent), var(--akzent-2));
    border-color: transparent;
    color: var(--akzent-text);
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(194, 65, 12, .3);
  }
  .stream-button:disabled { opacity: .55; cursor: progress; }
  .stream-button.laadt::before {
    content: "";
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 2px solid currentColor;
    border-top-color: transparent;
    animation: dreh 0.7s linear infinite;
  }
  .stream-button.fehler { border-color: var(--fehler); color: var(--fehler); }
  @media (max-width: 600px) {
    .folge-zeile { flex-wrap: wrap; }
    .stream-buttons { width: 100%; justify-content: flex-start; margin-top: 4px; padding-left: 46px; }
  }

  /* Player erscheint unter der Folge */
  .player-box {
    margin: 0 8px 8px;
    border-radius: var(--radius-klein);
    overflow: hidden;
    background: #000;
    border: 1px solid var(--linie);
  }
  .player-box video {
    display: block;
    width: 100%;
    max-height: 70vh;
    background: #000;
  }
  .player-fehler {
    padding: 12px 14px;
    background: var(--fehler-weich);
    color: var(--fehler);
    font-size: .85rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .player-hinweis {
    padding: 8px 12px;
    background: var(--flaeche-2);
    color: var(--text-2);
    font-size: .78rem;
    border-bottom: 1px solid var(--linie);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .player-schliessen {
    background: none; border: 0; padding: 2px 8px;
    color: var(--text-2); cursor: pointer;
    font-size: 1.1rem; line-height: 1;
    border-radius: 6px;
  }
  .player-schliessen:hover { color: var(--text); background: var(--flaeche-3); }

  /* ---------- Details / Sprache / Info ---------- */
  details { margin-top: 20px; border-top: 1px solid var(--linie); padding-top: 14px; }
  summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--text-2);
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color var(--übergang);
  }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: "›";
    display: inline-block;
    transition: transform var(--übergang);
    color: var(--akzent);
    font-size: 1.2em;
    line-height: 1;
  }
  details[open] summary::before { transform: rotate(90deg); }
  summary:hover { color: var(--text); }
  details p { margin: 14px 0 0; line-height: 1.6; }
  dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 8px 16px;
    margin: 14px 0 0;
    font-size: .925rem;
  }
  dt { color: var(--text-2); font-weight: 500; }
  dd { margin: 0; }
  @media (max-width: 540px) {
    dl { grid-template-columns: 1fr; gap: 2px; }
    dd { margin-bottom: 10px; }
  }

  /* ---------- Fehlerkarte ---------- */
  .fehler-karte { border-color: var(--fehler); }
  .fehler-karte h2 { color: var(--fehler); font-size: 1.1rem; margin: 0 0 8px; font-weight: 700; }
  .fehler-karte p { margin: 0 0 12px; }

  /* ---------- Fußzeile ---------- */
  footer {
    margin-top: 32px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 16px;
    border-top: 1px solid var(--linie);
  }

  .fuss-knoepfe { display: flex; gap: 16px; flex-wrap: wrap; }

  /* ---------- Animationen ---------- */
  @keyframes erscheinen {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .karte { animation: erscheinen var(--übergang) ease-out; }

  [hidden] { display: none !important; }

  /* Erschwinglichkeit: Bewegung reduzieren */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<div class="rahmen">
  <header>
    <h1>Serien-<span>Katalog</span></h1>
    <button id="zurStartseite" class="knopf-text" type="button" hidden>Meine Serien</button>
  </header>

  <!-- Zugangskarte: nur ohne Token sichtbar -->
  <section id="zugang" class="karte" hidden>
    <form id="zugangForm">
      <label for="tokenFeld">Zugangs-Token</label>
      <input id="tokenFeld" type="password" autocomplete="current-password" required placeholder="Token einfügen">
      <p id="zugangHinweis" class="leise" style="margin:8px 0 12px">Wird nur in diesem Browser gespeichert.</p>
      <button class="knopf" type="submit">Speichern</button>
    </form>
  </section>

  <!-- Suchkarte: nur mit Token sichtbar -->
  <section id="suchbereich" class="karte" hidden>
    <form id="suche" class="suche" autocomplete="off">
      <div class="serie-feld">
        <label for="serie">Serie</label>
        <input id="serie" type="text" required maxlength="200" placeholder="z. B. Furious" enterkeyhint="search">
      </div>
      <button id="los" class="knopf" type="submit">Suchen</button>
    </form>
  </section>

  <!-- Ausgabebereich: dynamisch gefüllt -->
  <div id="ausgabe"></div>

  <footer>
    <span class="leise">Staffel 0 = Specials</span>
    <span class="fuss-knoepfe">
      <a class="knopf-text" href="video">Video-Link abspielen</a>
      <button id="linkKopieren" class="knopf-text" type="button" hidden>Zugangslink kopieren</button>
      <button id="tokenAendern" class="knopf-text" type="button" hidden>Token ändern</button>
    </span>
  </footer>
</div>

<script>
(() => {
  'use strict';
  const TOKEN_SCHLUESSEL = 'serienKatalog.token';
  const $ = (id) => document.getElementById(id);

  // ---------- LocalStorage-Helfer ----------
  const speicher = {
    lesen(k) { try { return localStorage.getItem(k); } catch { return null; } },
    schreiben(k, v) { try { localStorage.setItem(k, v); } catch { /* privater Modus */ } },
    loeschen(k) { try { localStorage.removeItem(k); } catch { /* egal */ } },
  };
  let sitzungsToken = null;
  const tokenLesen = () => sitzungsToken || speicher.lesen(TOKEN_SCHLUESSEL);
  const tokenSetzen = (t) => { sitzungsToken = t; speicher.schreiben(TOKEN_SCHLUESSEL, t); };
  // Die frühere „Zuletzt“-Liste ist durch das Register ersetzt.
  speicher.loeschen('serienKatalog.zuletzt');

  // ---------- DOM-Baukasten ----------
  // el('div', {class: 'x'}, 'Text', kind) – Text immer als textContent, sicher.
  function el(tag, attrs, ...kinder) {
    const knoten = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k.startsWith('on')) knoten.addEventListener(k.slice(2), v);
      else if (k === 'class') knoten.className = v;
      else knoten.setAttribute(k, v === true ? '' : v);
    }
    for (const kind of kinder.flat(Infinity)) {
      if (kind === null || kind === undefined || kind === false) continue;
      knoten.append(kind instanceof Node ? kind : document.createTextNode(String(kind)));
    }
    return knoten;
  }

  // SVG-Icon erzeugen (z. B. Chevron, externer Link).
  function icon(pfad, viewBox = '0 0 24 24') {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', viewBox);
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.style.width = '1em';
    svg.style.height = '1em';
    svg.innerHTML = pfad;
    return svg;
  }
  const CHEVRON = '<polyline points="6 9 12 15 18 9"></polyline>';
  const EXTERN = '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line>';

  // ---------- Staffel-Helfer ----------
  const staffelNummer = (name) => {
    const t = String(name).trim();
    if (/^\d+$/.test(t)) return Number(t);
    if (/special/i.test(t)) return 0;
    const m = t.match(/\d+/);
    return m ? Number(m[0]) : null;
  };
  const staffelName = (nr, namen) => {
    const passend = (namen || []).find((n) => staffelNummer(n) === nr);
    if (nr === 0) return passend && !/^\d+$/.test(passend) ? passend : 'Specials';
    return `Staffel ${nr}`;
  };

  // ---------- Zustand ----------
  let aktuelleDaten = null;   // Original-Antwort des Dienstes, plus .anfrage
  let laufendeAbfrage = null;
  let speicherFehler = null;  // Meldung, wenn ein Haken nicht gespeichert wurde

  function zeigeAusgabe(...knoten) {
    $('ausgabe').replaceChildren(...knoten);
  }

  function zugangZeigen(hinweis) {
    $('suchbereich').hidden = true;
    $('zugang').hidden = false;
    $('tokenAendern').hidden = true;
    $('linkKopieren').hidden = true;
    $('zurStartseite').hidden = true;
    $('zugangHinweis').textContent = hinweis || 'Wird nur in diesem Browser gespeichert.';
    zeigeAusgabe();
    $('tokenFeld').value = '';
    $('tokenFeld').focus();
  }

  function sucheZeigen() {
    $('zugang').hidden = true;
    $('suchbereich').hidden = false;
    $('tokenAendern').hidden = false;
    $('linkKopieren').hidden = false;
    $('zurStartseite').hidden = false;
  }

  function tokenAbgelehnt() {
    speicher.loeschen(TOKEN_SCHLUESSEL);
    sitzungsToken = null;
    zugangZeigen('Das Token wurde nicht angenommen. Bitte neu eingeben.');
  }

  // Aufruf des Dienstes mit Token; liefert { antwort, daten }.
  async function dienst(pfad, optionen = {}) {
    const kopf = { Authorization: `Bearer ${tokenLesen()}` };
    if (optionen.body) kopf['Content-Type'] = 'application/json';
    const antwort = await fetch(pfad, { ...optionen, headers: kopf });
    const daten = await antwort.json().catch(() => null);
    return { antwort, daten };
  }

  // ---------- Gesehen-Register ----------
  // Das Register liegt auf dem Server und gilt damit auf allen Geräten.
  const register = new Map();   // Titel in Kleinbuchstaben -> Eintrag
  let registerGeladen = false;
  let registerBereit = null;    // Promise des letzten Ladevorgangs
  let speicherKette = Promise.resolve();
  const schluessel = (titel) => String(titel).trim().toLowerCase();

  function registerLaden() {
    registerBereit = (async () => {
      try {
        const { antwort, daten } = await dienst('gesehen');
        if (antwort.status === 401) { tokenAbgelehnt(); return false; }
        if (antwort.ok && daten && daten.ok) {
          register.clear();
          for (const e of daten.serien) register.set(schluessel(e.titel), e);
          registerGeladen = true;
          return true;
        }
      } catch { /* unten als nicht geladen behandelt */ }
      registerGeladen = false;
      return false;
    })();
    return registerBereit;
  }

  const gesehenMenge = (titel, staffel) => {
    const e = register.get(schluessel(titel));
    const s = e && e.gesehen[staffel];
    return new Set(s ? s.folgen : []);
  };

  // Stand einer Serie: letzte gesehene Folge und die Staffel, bei der es weitergeht.
  function stand(eintrag) {
    const nummern = Object.keys(eintrag.gesehen).map(Number).sort((a, b) => a - b);
    const anzahl = nummern.reduce((summe, n) => summe + eintrag.gesehen[n].folgen.length, 0);
    const regulaer = nummern.filter((n) => n > 0);
    const letzteStaffel = regulaer.length ? regulaer[regulaer.length - 1] : nummern[nummern.length - 1];
    const s = eintrag.gesehen[letzteStaffel];
    const letzteFolge = s.folgen[s.folgen.length - 1];
    const fertig = s.anzahlFolgen > 0 && s.folgen.length >= s.anzahlFolgen;
    const gibtNaechste = (eintrag.staffeln || []).some((n) => staffelNummer(n) === letzteStaffel + 1);
    return {
      anzahl, letzteStaffel, letzteFolge, fertig,
      weiterStaffel: fertig && gibtNaechste && letzteStaffel > 0 ? letzteStaffel + 1 : letzteStaffel,
    };
  }

  // Hakt Folgen der gezeigten Staffel ab oder nimmt den Haken weg.
  function gesehenSetzen(nummern, wert) {
    const d = aktuelleDaten;
    const titel = d.serie.titel || d.anfrage.serie;
    const staffel = d.staffel.nummer;
    const anzahlFolgen = (d.staffel.folgen || []).length;

    // Sofort anzeigen; der Server bestätigt gleich mit dem gültigen Stand.
    const alt = register.get(schluessel(titel));
    const eintrag = alt ? JSON.parse(JSON.stringify(alt)) : { titel, staffeln: d.serie.staffeln || [], gesehen: {} };
    const s = eintrag.gesehen[staffel] || { anzahlFolgen, folgen: [] };
    const menge = new Set(s.folgen);
    for (const n of nummern) wert ? menge.add(n) : menge.delete(n);
    s.folgen = [...menge].sort((a, b) => a - b);
    if (s.folgen.length) eintrag.gesehen[staffel] = s; else delete eintrag.gesehen[staffel];
    if (Object.keys(eintrag.gesehen).length) register.set(schluessel(titel), eintrag);
    else register.delete(schluessel(titel));
    speicherFehler = null;
    ergebnisZeigen({ scrollen: false });

    // Änderungen nacheinander senden, damit die Antworten in Reihenfolge ankommen.
    speicherKette = speicherKette.then(async () => {
      try {
        const { antwort, daten } = await dienst('gesehen', {
          method: 'POST',
          body: JSON.stringify({
            serie: titel, staffel, folgen: nummern, gesehen: wert,
            anzahlFolgen, staffeln: d.serie.staffeln || [],
          }),
        });
        if (antwort.status === 401) return tokenAbgelehnt();
        if (!antwort.ok || !daten || !daten.ok) throw new Error((daten && daten.fehler) || `Fehler ${antwort.status}`);
        if (daten.serie) register.set(schluessel(titel), daten.serie);
        else register.delete(schluessel(titel));
      } catch (fehler) {
        // Anzeige wieder auf den Stand des Servers bringen.
        await registerLaden();
        speicherFehler = `Nicht gespeichert: ${fehler.message === 'Failed to fetch' ? 'keine Verbindung' : fehler.message}. Bitte noch einmal abhaken.`;
        if (aktuelleDaten === d) ergebnisZeigen({ scrollen: false });
      }
    });
  }

  async function serieEntfernen(titel) {
    if (!confirm(`„${titel}“ mit allen Haken aus dem Register entfernen?`)) return;
    try {
      const { antwort, daten } = await dienst('gesehen', {
        method: 'POST', body: JSON.stringify({ serie: titel, entfernen: true }),
      });
      if (antwort.status === 401) return tokenAbgelehnt();
      if (!antwort.ok || !daten || !daten.ok) throw new Error();
      register.delete(schluessel(titel));
      speicherFehler = null;
    } catch {
      speicherFehler = 'Entfernen hat nicht geklappt. Bitte noch einmal versuchen.';
    }
    if (aktuelleDaten) ergebnisZeigen({ scrollen: false });
    else startseiteZeigen();
  }

  // ---------- Startseite: Meine Serien ----------
  async function startseiteZeigen({ verlauf = null } = {}) {
    if (laufendeAbfrage) laufendeAbfrage.abort();
    aktuelleDaten = null;
    $('serie').value = '';
    if (verlauf && location.search) history.pushState(null, '', location.pathname);
    document.title = 'Serien-Katalog';

    if (!registerGeladen) {
      zeigeAusgabe(el('section', { class: 'karte lade', 'aria-live': 'polite' },
        el('div', { class: 'kreisel', 'aria-hidden': 'true' }),
        el('div', { class: 'lade-text' }, 'Lade dein Register …')));
      await (registerBereit || registerLaden());
      if (aktuelleDaten || laufendeAbfrage || !tokenLesen()) return;
    }
    if (!registerGeladen) {
      return zeigeAusgabe(el('section', { class: 'karte fehler-karte', role: 'alert' },
        el('h2', {}, 'Register nicht erreichbar'),
        el('p', {}, 'Deine abgehakten Folgen ließen sich gerade nicht laden.'),
        el('button', {
          type: 'button', class: 'knopf', style: 'width:auto',
          onclick: () => { registerLaden(); startseiteZeigen(); },
        }, 'Erneut versuchen')));
    }

    const serien = [...register.values()].sort((a, b) => String(b.geaendert).localeCompare(String(a.geaendert)));
    const teile = [el('h2', { class: 'titel klein' }, 'Meine Serien')];
    if (!serien.length) {
      teile.push(el('p', { class: 'leise' },
        'Noch nichts abgehakt. Suche oben eine Serie und hake die Folgen ab, die du gesehen hast.'));
    } else {
      teile.push(el('div', { class: 'serien-liste' }, serien.map((e) => {
        const st = stand(e);
        return el('button', {
          type: 'button', class: 'serien-zeile',
          onclick: () => abfragen({ serie: e.titel, staffel: st.weiterStaffel, folge: null }),
        },
          el('span', { class: 'serien-name' }, e.titel),
          el('span', { class: 'serien-stand' },
            `Zuletzt: ${staffelName(st.letzteStaffel, e.staffeln)}, Folge ${st.letzteFolge}`,
            st.fertig ? ' · Staffel komplett' : '',
            el('span', { class: 'trenner' }, '·'),
            `${st.anzahl} gesehen`));
      })));
    }
    zeigeAusgabe(el('section', { class: 'karte' }, ...teile));
  }

  // ---------- Adresszeile ----------
  function adresseSetzen(anfrage, ersetzen) {
    const p = new URLSearchParams();
    p.set('serie', anfrage.serie);
    p.set('staffel', String(anfrage.staffel));
    if (anfrage.folge !== null) p.set('folge', String(anfrage.folge));
    const neu = `${location.pathname}?${p}`;
    if (neu === location.pathname + location.search) return;
    history[ersetzen ? 'replaceState' : 'pushState'](anfrage, '', neu);
  }
  function anfrageAusAdresse() {
    const p = new URLSearchParams(location.search);
    const serie = (p.get('serie') || '').trim();
    if (!serie) return null;
    const zahl = (w, std) => (w !== null && /^\d{1,4}$/.test(w) ? Number(w) : std);
    return { serie, staffel: zahl(p.get('staffel'), 1), folge: zahl(p.get('folge'), null) };
  }

  // ---------- Abfrage ----------
  async function abfragen(anfrage, { verlauf = 'push' } = {}) {
    $('serie').value = anfrage.serie;
    if (verlauf) adresseSetzen(anfrage, verlauf === 'replace');

    if (laufendeAbfrage) laufendeAbfrage.abort();
    const abbruch = new AbortController();
    laufendeAbfrage = abbruch;
    aktuelleDaten = null;
    speicherFehler = null;

    const start = Date.now();
    const sekunden = el('span', { class: 'leise' }, '');
    const ladeKarte = el('section', { class: 'karte lade', 'aria-live': 'polite' },
      el('div', { class: 'kreisel', 'aria-hidden': 'true' }),
      el('div', { class: 'lade-text' },
        el('div', {}, `Lese „${anfrage.serie}“, ${staffelName(anfrage.staffel)} …`),
        el('div', { class: 'leise' }, 'Das dauert meist rund 10 Sekunden. ', sekunden)),
    );
    zeigeAusgabe(ladeKarte);
    const uhr = setInterval(() => {
      sekunden.textContent = `(${Math.round((Date.now() - start) / 1000)} s)`;
    }, 1000);
    $('los').disabled = true;

    // Original-Ausgabe: enthält je Folge auch die Anbieter (staffel.folgen[].hoster).
    const p = new URLSearchParams({
      serie: anfrage.serie,
      staffel: String(anfrage.staffel),
      ausgabe: 'original',
    });

    let antwort, daten;
    try {
      antwort = await fetch(`katalog?${p}`, {
        headers: { Authorization: `Bearer ${tokenLesen()}` },
        signal: abbruch.signal,
      });
      daten = await antwort.json().catch(() => null);
      // Ohne Register ließen sich die Haken nicht richtig zeigen.
      if (!registerGeladen) await (registerBereit || registerLaden());
    } catch (fehler) {
      if (fehler.name === 'AbortError') return;
      clearInterval(uhr);
      $('los').disabled = false;
      return fehlerZeigen('Keine Verbindung', 'Der Dienst ist gerade nicht erreichbar. Bitte gleich noch einmal versuchen.', anfrage);
    } finally {
      if (laufendeAbfrage === abbruch) {
        clearInterval(uhr);
        $('los').disabled = false;
        laufendeAbfrage = null;
      }
    }
    if (abbruch.signal.aborted) return;

    if (antwort.status === 401) return tokenAbgelehnt();
    if (antwort.ok && daten && daten.ok) {
      aktuelleDaten = { ...daten, anfrage };
      return ergebnisZeigen();
    }
    const meldung = (daten && daten.fehler) || `Fehler ${antwort.status}`;
    if (antwort.status === 404) return fehlerZeigen('Nicht gefunden', meldung, anfrage, daten);
    if (antwort.status === 429) return fehlerZeigen('Gerade viel los', meldung, anfrage);
    return fehlerZeigen('Das Auslesen hat nicht geklappt', meldung, anfrage);
  }

  // ---------- Anbieter ----------
  // Der Dienst liefert je Folge eine Liste { title, href }.
  function hosterListe(hoster) {
    if (!Array.isArray(hoster)) return [];
    return hoster
      .filter((h) => h && typeof h === 'object')
      .map((h) => ({ name: String(h.title || h.name || 'Anbieter'), url: h.href ? String(h.href) : null }));
  }

  function hosterRendern(hoster, folgeNode) {
    const liste = hosterListe(hoster);
    if (!liste.length) {
      return el('span', { class: 'leise-klein', style: 'white-space:nowrap' }, 'keine Anbieter');
    }

    // Container für die Stream-Buttons (inline in der Folge-Zeile)
    const container = el('div', { class: 'stream-buttons' });

    for (const h of liste) {
      if (!h.url) {
        container.append(el('span', { class: 'stream-button', style: 'opacity:.5;cursor:default' }, h.name));
        continue;
      }
      const btn = el('button', { type: 'button', class: 'stream-button', 'data-url': h.url }, h.name);
      btn.addEventListener('click', async () => {
        if (btn.classList.contains('laadt')) return;

        // Bestehenden Player unter dieser Folge entfernen
        const bestehend = folgeNode.querySelector(':scope > .player-box');
        if (bestehend) bestehend.remove();

        // Button in Ladezustand
        btn.classList.add('laadt');
        btn.disabled = true;

        try {
          const p = new URLSearchParams({ url: h.url });
          const antwort = await fetch(`stream?${p}`, {
            headers: { Authorization: `Bearer ${tokenLesen()}` },
          });
          const daten = await antwort.json().catch(() => null);

          if (!antwort.ok || !daten || !daten.ok) {
            const msg = (daten && daten.fehler) || `Fehler ${antwort.status}`;
            btn.classList.remove('laadt');
            btn.classList.add('fehler');
            btn.disabled = false;
            setTimeout(() => btn.classList.remove('fehler'), 3000);
            folgeNode.append(el('div', { class: 'player-box' },
              el('div', { class: 'player-fehler' },
                el('span', {}, '⚠ '),
                el('span', {}, msg))));
            return;
          }

          // Erfolg: Player unter der Folge einblenden
          btn.classList.remove('laadt');
          btn.disabled = false;
          const video = el('video', {
            controls: '',
            autoplay: '',
            preload: 'metadata',
            playsinline: '',
          });
          video.src = daten.mp4;
          const schliessen = el('button', { type: 'button', class: 'player-schliessen', 'aria-label': 'Player schließen' }, '×');
          schliessen.addEventListener('click', () => {
            video.pause();
            box.remove();
          });
          const box = el('div', { class: 'player-box' },
            el('div', { class: 'player-hinweis' },
              el('span', {}, `Quelle: ${h.name}${daten.cached ? ' · aus Cache' : ''}`),
              schliessen),
            video);
          folgeNode.append(box);
        } catch (fehler) {
          btn.classList.remove('laadt');
          btn.classList.add('fehler');
          btn.disabled = false;
          setTimeout(() => btn.classList.remove('fehler'), 3000);
          folgeNode.append(el('div', { class: 'player-box' },
            el('div', { class: 'player-fehler' },
              el('span', {}, '⚠ '),
              el('span', {}, 'Verbindung zum Stream-Dienst fehlgeschlagen'))));
        }
      });
      container.append(btn);
    }
    return container;
  }

  // ---------- Darstellung ----------
  function fehlerZeigen(ueberschrift, meldung, anfrage, daten) {
    const teile = [el('h2', {}, ueberschrift), el('p', {}, meldung)];

    const vorschlaege = (daten && (daten.kandidaten || daten.aehnlicheTreffer)) || [];
    if (vorschlaege.length) {
      teile.push(el('div', { class: 'abschnitt' },
        el('span', { class: 'leise' }, daten.kandidaten ? 'Welche ist gemeint?' : 'Meintest du eine davon?'),
        el('div', { class: 'chips' }, vorschlaege.map((name) =>
          el('button', {
            type: 'button', class: 'chip',
            onclick: () => abfragen({ serie: name, staffel: anfrage.staffel, folge: anfrage.folge }),
          }, name)))));
    }
    // Serie erkannt, aber die Staffel fehlt: vorhandene Staffeln anbieten.
    const staffeln = daten && daten.staffeln;
    if (Array.isArray(staffeln) && staffeln.length) {
      teile.push(el('div', { class: 'abschnitt' },
        el('span', { class: 'leise' }, `Vorhandene Staffeln${daten.serie ? ` von ${daten.serie}` : ''}`),
        el('div', { class: 'chips' }, staffeln.map((name) => {
          const nr = staffelNummer(name);
          return nr === null
            ? el('span', { class: 'chip still' }, name)
            : el('button', {
                type: 'button', class: 'chip',
                onclick: () => abfragen({ serie: daten.serie || anfrage.serie, staffel: nr, folge: null }),
              }, name);
        }))));
    }
    if (!vorschlaege.length && !(Array.isArray(staffeln) && staffeln.length)) {
      teile.push(el('button', {
        type: 'button', class: 'knopf', style: 'width:auto;margin-top:4px',
        onclick: () => abfragen(anfrage, { verlauf: null }),
      }, 'Erneut versuchen'));
    }
    zeigeAusgabe(el('section', { class: 'karte fehler-karte', role: 'alert' }, ...teile));
  }

  function folgeWaehlen(nummer) {
    const a = aktuelleDaten.anfrage;
    const neu = { ...a, folge: a.folge === nummer ? null : nummer };
    aktuelleDaten.anfrage = neu;
    adresseSetzen(neu, true);
    ergebnisZeigen({ scrollen: false });
  }

  function ergebnisZeigen({ scrollen = true } = {}) {
    const d = aktuelleDaten;
    const serieTitel = d.serie.titel || d.anfrage.serie;
    const folgeNr = d.anfrage.folge;
    const folgen = d.staffel.folgen || [];
    const gesucht = folgeNr === null ? null : folgen.find((f) => f.nummer === folgeNr);
    const eintrag = register.get(schluessel(serieTitel));
    const gesehen = gesehenMenge(serieTitel, d.staffel.nummer);
    const anzahlGesehen = folgen.filter((f) => gesehen.has(f.nummer)).length;
    const alleGesehen = folgen.length > 0 && anzahlGesehen === folgen.length;
    document.title = `${serieTitel} – Serien-Katalog`;

    // Beim Neuzeichnen nach einem Haken: Fokus behalten.
    const fokus = scrollen ? null : document.activeElement && document.activeElement.id;

    // Kopf
    const kopf = [
      el('h2', { class: 'titel' }, serieTitel),
      el('p', { class: 'meta' },
        staffelName(d.staffel.nummer, d.serie.staffeln),
        el('span', { class: 'trenner' }, '·'),
        `${folgen.length} ${folgen.length === 1 ? 'Folge' : 'Folgen'}`),
    ];
    if (folgeNr !== null && !gesucht) {
      kopf.push(el('div', { class: 'treffer nein' },
        el('span', { class: 'treffer-dot' }),
        `Folge ${folgeNr} gibt es in ${staffelName(d.staffel.nummer, d.serie.staffeln)} nicht.`));
    }

    // Staffel-Leiste mit Stand je Staffel aus dem Register
    const staffelLeiste = el('div', { class: 'abschnitt staffel-leiste' },
      el('span', { class: 'leise' }, 'Staffeln'),
      el('div', { class: 'chips' }, (d.serie.staffeln || []).map((name) => {
        const nr = staffelNummer(name);
        const s = eintrag && nr !== null ? eintrag.gesehen[nr] : null;
        const fertig = nr === d.staffel.nummer ? alleGesehen : !!s && s.anzahlFolgen > 0 && s.folgen.length >= s.anzahlFolgen;
        const begonnen = nr === d.staffel.nummer ? anzahlGesehen > 0 : !!s;
        const zusatz = fertig ? ' fertig' : begonnen ? ' begonnen' : '';
        const hinweis = fertig ? `${name} (komplett gesehen)` : begonnen ? `${name} (teilweise gesehen)` : name;
        if (nr === d.staffel.nummer) return el('span', { class: `chip aktiv${zusatz}`, 'aria-current': 'true', title: hinweis }, name);
        if (nr === null) return el('span', { class: 'chip still' }, name);
        return el('button', {
          type: 'button', class: `chip${zusatz}`, title: hinweis, 'aria-label': hinweis,
          onclick: () => abfragen({ serie: serieTitel, staffel: nr, folge: null }),
        }, name);
      })));

    // Fortschritt der Staffel und „alle abhaken“
    const fortschritt = el('div', { class: 'fortschritt' },
      el('div', { class: 'fortschritt-text' },
        el('strong', {}, `${anzahlGesehen} von ${folgen.length}`), ' gesehen',
        el('div', { class: 'balken', 'aria-hidden': 'true' },
          el('div', { class: 'balken-fuellung', style: `width:${folgen.length ? (anzahlGesehen / folgen.length) * 100 : 0}%` }))),
      el('button', {
        type: 'button', class: 'chip', id: 'alleKnopf', disabled: !registerGeladen,
        onclick: () => gesehenSetzen(folgen.map((f) => f.nummer), !alleGesehen),
      }, alleGesehen ? 'Alle Haken entfernen' : 'Ganze Staffel gesehen'));

    // Folgenliste
    let markierteZeile = null;
    const folgenNode = el('div', { class: 'folgen' }, ...folgen.map((f) => {
      const hoster = hosterListe(f.hoster);
      const istMarkiert = f.nummer === folgeNr;
      const istGesehen = gesehen.has(f.nummer);
      const node = el('div', {
        class: `folge${istMarkiert ? ' markiert' : ''}${istGesehen ? ' gesehen' : ''}`,
        'data-folge': f.nummer,
      },
        el('div', { class: 'folge-zeile' },
          el('label', { class: 'haken-feld', title: istGesehen ? 'Gesehen' : 'Als gesehen abhaken' },
            el('input', {
              type: 'checkbox', class: 'haken', id: `haken-${f.nummer}`,
              checked: istGesehen, disabled: !registerGeladen,
              'aria-label': `Folge ${f.nummer} gesehen`,
              onchange: (e) => gesehenSetzen([f.nummer], e.target.checked),
            })),
          el('div', {
            class: 'folge-kopf',
            onclick: () => folgeWaehlen(f.nummer),
          },
            el('div', { class: 'folge-nr' }, f.nummer),
            el('div', { class: 'folge-titel' },
              el('div', { class: 'folge-titel-text' }, f.titel || '–')))));
      // Erst anhängen, wenn es node gibt: die Anbieter-Knöpfe brauchen ihn.
      node.querySelector('.folge-zeile').append(hosterRendern(f.hoster, node));
      if (istMarkiert) markierteZeile = node;
      return node;
    }));

    const teile = [...kopf, staffelLeiste];
    if (!registerGeladen) {
      teile.push(el('div', { class: 'treffer nein' }, el('span', { class: 'treffer-dot' }),
        'Das Register ist gerade nicht erreichbar – Abhaken geht im Moment nicht.'));
    }
    if (speicherFehler) {
      teile.push(el('div', { class: 'treffer nein', role: 'alert' }, el('span', { class: 'treffer-dot' }), speicherFehler));
    }
    if (folgen.length === 0) {
      teile.push(el('p', { class: 'leise' }, 'Für diese Staffel sind keine Folgen gelistet.'));
    } else {
      teile.push(fortschritt, folgenNode);
    }

    // Sprachen
    if (d.serie.sprachen && d.serie.sprachen.length) {
      teile.push(el('div', { class: 'abschnitt' },
        el('span', { class: 'leise' }, 'Sprachen'),
        el('div', { class: 'chips' }, d.serie.sprachen.map((s) => el('span', { class: 'chip still' }, s)))));
    }

    // Über die Serie (Beschreibung + Infos)
    const infos = Object.entries(d.serie.infos || {}).filter(([, werte]) => werte && werte.length);
    if (d.serie.beschreibung || infos.length) {
      const warOffen = !scrollen && !!document.querySelector('#ausgabe details[open]');
      teile.push(el('details', { open: warOffen },
        el('summary', {}, 'Über die Serie'),
        d.serie.beschreibung ? el('p', {}, d.serie.beschreibung) : null,
        infos.length ? el('dl', {}, infos.map(([k, werte]) => [
          el('dt', {}, k.replace(/:$/, '')),
          el('dd', {}, werte.join(', ')),
        ])) : null));
    }

    if (eintrag) {
      teile.push(el('p', { class: 'register-fuss' },
        el('button', { type: 'button', class: 'knopf-text', onclick: () => serieEntfernen(serieTitel) },
          'Serie aus dem Register entfernen')));
    }

    zeigeAusgabe(el('section', { class: 'karte' }, ...teile));

    if (fokus && $(fokus)) $(fokus).focus({ preventScroll: true });
    // Wurde eine Folge über die Adresse angefragt, zu ihr scrollen.
    if (scrollen && gesucht && markierteZeile) {
      markierteZeile.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  // ---------- Ereignisse ----------
  $('suche').addEventListener('submit', (e) => {
    e.preventDefault();
    const serie = $('serie').value.trim();
    if (!serie) return;
    $('serie').blur();
    // Bekannte Serie: dort einsteigen, wo es weitergeht. Sonst Staffel 1.
    const eintrag = register.get(schluessel(serie));
    abfragen({ serie, staffel: eintrag ? stand(eintrag).weiterStaffel : 1, folge: null });
  });

  function starten() {
    sucheZeigen();
    registerLaden();
    const a = anfrageAusAdresse();
    if (a) abfragen(a, { verlauf: null });
    else startseiteZeigen();
  }

  $('zugangForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const t = $('tokenFeld').value.trim();
    if (!t) return;
    tokenSetzen(t);
    starten();
  });

  $('tokenAendern').addEventListener('click', () => zugangZeigen());

  // Link mit Token für ein weiteres Gerät: dort öffnen, und es ist angemeldet.
  $('linkKopieren').addEventListener('click', async () => {
    const knopf = $('linkKopieren');
    const link = `${location.origin}${location.pathname}#token=${encodeURIComponent(tokenLesen())}`;
    try {
      await navigator.clipboard.writeText(link);
      knopf.textContent = 'Kopiert – wie ein Passwort behandeln';
    } catch {
      // Ohne Zugriff auf die Zwischenablage: zum Markieren und Kopieren anzeigen.
      prompt('Zugangslink (wie ein Passwort behandeln):', link);
    }
    setTimeout(() => { knopf.textContent = 'Zugangslink kopieren'; }, 4000);
  });
  $('zurStartseite').addEventListener('click', () => startseiteZeigen({ verlauf: 'push' }));

  window.addEventListener('popstate', () => {
    if (!tokenLesen()) return;
    const a = anfrageAusAdresse();
    if (a) abfragen(a, { verlauf: null });
    else startseiteZeigen();
  });

  // ---------- Start ----------
  // Token per Link übernehmen (#token=…); das Fragment geht nie an den Server.
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('token')) {
    tokenSetzen(hash.get('token'));
    history.replaceState(null, '', location.pathname + location.search);
  }

  if (!tokenLesen()) return zugangZeigen();
  starten();
})();
</script>
</body>
</html>
